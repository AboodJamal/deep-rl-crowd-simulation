## References

1. **VGA Paper**: arXiv:2501.05100v2
   - "Variable Goal Approach (VGA) Incorporating Human Intelligence into the Microscopic Pedestrian Dynamics Models"
   - Pedestrian radius: 0.2m
   - Obstacle clustering threshold: pedestrian size

2. **Helbing & Molnár (1995)**: Social Force Model
   - A = 2000N, B = 0.08m
   - Relaxation time τ = 0.5s

3. **Weidmann (1993)**: Pedestrian Speed
   - Comfortable walking speed: 1.34 m/s

4. **Standard Pedestrian Dynamics**:
   - Pedestrian radius: 0.2-0.3m (shoulder width)
   - Human-sized obstacle: ~0.25m radius

---

## Data Validation Checklist

Before running experiments, verify:
- [ ] All data files exist and are readable
- [ ] Obstacle positions loaded correctly
- [ ] Initial/final positions parsed correctly
- [ ] Desired speeds are reasonable (0.5-2.5 m/s)
- [ ] Obstacle radius set to 0.25m
- [ ] Pedestrian radius set to 0.2m
- [ ] UPL parameters match Helbing & Molnár (1995)
- [ ] Goal tolerance set to 0.3m
- [ ] Max simulation time sufficient for each scenario

