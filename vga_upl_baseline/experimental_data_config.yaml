# Experimental Data Configuration
# ================================
# Complete configuration for VGA+UPL validation against real experimental data
# All parameters are scientifically validated from literature

## Physical Parameters (from VGA Paper & Literature)

### Pedestrian Parameters
pedestrian_radius: 0.2  # meters - VGA paper mentions 0.2m, matches UPL physics
pedestrian_mass: 80.0  # kg - average adult
pedestrian_shoulder_width: 0.4  # meters - for reference

### Obstacle Parameters
obstacle_radius: 0.25  # meters - human-sized stationary obstacles (VGA paper)
obstacle_type: "human-sized stationary"  # non-living obstacles

### Clustering Parameters (from VGA Paper)
# "Obstacles are grouped into a cluster if their surface-to-surface distance 
# is lesser than the pedestrian size"
clustering_threshold: 0.2  # meters - same as pedestrian_radius

### UPL Physics Parameters (Helbing & Molnár 1995)
upl_parameters:
  A: 2000.0  # N - Repulsion strength
  B: 0.08    # m - Interaction range
  r: 0.2     # m - Agent radius (matches pedestrian_radius)
  v_desired: 1.34  # m/s - Weidmann's comfortable walking speed
  tau: 0.5   # s - Relaxation time constant
  mass: 80.0  # kg - Agent mass
  max_speed: 2.5  # m/s - Maximum speed limit
  dt: 0.05   # s - Time step for integration
  safety_margin: 0.1  # m - Extra clearance from obstacles

### VGA Parameters
vga_parameters:
  personal_distance: 0.5  # m - Preferred distance from obstacles
  cone_angle: 90  # degrees - Field of view for obstacle detection
  goal_tolerance: 0.3  # m - Distance to goal considered as "reached"

