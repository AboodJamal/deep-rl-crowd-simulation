## Dataset Specifications

### Data Location (relative to project root)
data_root: "../data/VGA-Experimental-Data"

### Available Datasets

#### 1. SOSP (Single Obstacle Single Pedestrian)
sosp:
  description: "Single stationary obstacle obstructing pedestrian path"
  num_trials: 54
  max_time: 6.833  # seconds
  files:
    initial_final: "SOSP_initialFinalPos_feed.txt"
    obstacles: "SOSP_obstPos_feed.txt"
  data_format:
    initial_final_columns:
      - pedInitialPos_x
      - pedInitialPos_y
      - pedFinalPos_x
      - pedFinalPos_y
      - pedDesiredSpeed
      - ExpNo
    obstacle_columns:
      - obstPos_x
      - obstPos_y
      - obstNo
  num_obstacles: 1
  obstacle_positions:
    - x: 5.000
      y: 0.000
      radius: 0.25  # human-sized

