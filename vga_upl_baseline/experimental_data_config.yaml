## Simulation Parameters

### For Validation Experiments
max_steps: 1000  # Maximum simulation steps
goal_tolerance: 0.3  # meters - distance to goal considered as "reached"
dt: 0.05  # seconds - time step (matches UPL physics)

### Success Criteria
A trial is considered successful if:
1. Agent reaches within `goal_tolerance` of the goal position
2. Within `max_steps` simulation steps
3. Without collision (distance to obstacles > pedestrian_radius)

### Failure Modes
- Timeout: max_steps reached without reaching goal
- Stuck: velocity < 0.01 m/s for > 50 steps
- Collision: distance to obstacle < pedestrian_radius

